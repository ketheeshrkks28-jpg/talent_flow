<div class="main">

<h1>Offers</h1>

<p>Manage candidate job offers.</p>


<button onclick="showOfferForm()">
+ Create Offer
</button>


<div id="offerForm"
class="form-box hidden">

<h2>Create Offer</h2>

<input
id="offerCandidate"
placeholder="Candidate Name">


<input
id="offerRole"
placeholder="Job Role">


<input
id="offerSalary"
placeholder="Salary">


<input
id="joiningDate"
type="date">


<button onclick="addOffer()">
Create Offer
</button>

</div>


<div class="table-box">

<h2>Offer List</h2>


<table>

<thead>

<tr>

<th>Candidate</th>
<th>Role</th>
<th>Salary</th>
<th>Joining Date</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>


<tbody id="offerList"></tbody>

</table>

</div>

</div>


<script src="script.js"></script>

</body>

</html>
