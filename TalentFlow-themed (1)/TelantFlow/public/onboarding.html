<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TalentFlow - Onboarding</title>

<link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="sidebar">

<h2><img src="logo.png" alt="" class="logo"> TalentFlow</h2>

<a href="index.html">⌂ Dashboard</a>
<a href="candi.html">♙ Candidates</a>
<a href="jobs.html">▣ Jobs</a>

<a href="offers.html">▤ Offers</a>

<a href="onboarding.html" class="active">
⚙ Onboarding
</a>

</div>


<div class="main">

<h1>Onboarding</h1>

<p>Track new employee onboarding progress.</p>


<button onclick="showOnboardingForm()">
+ Add Onboarding
</button>


<div id="onboardingForm"
class="form-box hidden">

<h2>New Onboarding</h2>

<input
id="onboardCandidate"
placeholder="Candidate Name">


<input
id="onboardRole"
placeholder="Job Role">


<input
id="onboardDate"
type="date">


<select id="documents">

<option>Pending</option>

<option>In Progress</option>

<option>Completed</option>

</select>


<button onclick="addOnboarding()">
Create
</button>

</div>



<div class="table-box">

<h2>Onboarding List</h2>


<table>

<thead>

<tr>

<th>Candidate</th>
<th>Role</th>
<th>Joining Date</th>
<th>Documents</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>


<tbody id="onboardingList"></tbody>

</table>

</div>

</div>


<script src="script.js"></script>

</body>

</html>
